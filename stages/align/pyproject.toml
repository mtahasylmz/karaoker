[project]
name = "annemusic-stage-align"
version = "0.1.0"
description = "Stage 3: wav2vec2 forced alignment (segment text → per-word timings)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "annemusic-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "whisperx==3.1.6",
  "faster-whisper==1.0.3",
  # Floor is torch>=2.6: transformers>=4.57 (pulled in by qwen-asr's ceiling)
  # enforces CVE-2025-32434, which gates torch.load unless the weights are
  # safetensors. Any wav2vec2 checkpoint that publishes only pytorch_model.bin
  # (e.g. Turkish mpoyraz/wav2vec2-xls-r-300m-cv7-turkish) fails to load with
  # torch<2.6.
  # Ceiling is <2.9: torchaudio 2.9 removed the deprecated set_audio_backend()
  # that pyannote.audio (via whisperx 3.1.6) still calls at import time.
  # qwen-asr[vllm]'s torchaudio==2.9.1 is installed in a second pip step on
  # the Cloud Run GPU image, not in this workspace.
  "torch>=2.6,<2.9",
  "torchaudio>=2.6,<2.9",
  "numpy<2",
  "jsonschema>=4.23",
  "certifi>=2024",
  "soundfile>=0.12",
]

# Qwen3-ForcedAligner (Apache-2.0) is not listed here as an optional extra
# because `qwen-asr[vllm]` pins torchaudio==2.9.1 which conflicts with the
# torch>=2.6 / torchaudio>=2.6 floor this workspace uses. The GPU Cloud
# Run image installs it in a second pip step after the base deps:
#     RUN pip install --no-deps "qwen-asr[vllm]>=0.0.6" && \
#         pip install "qwen-asr[vllm]>=0.0.6"
# The import in src/align/pipeline.py is guarded, so CPU-only hosts keep
# running the whisperx path without needing qwen-asr present.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/align"]

[tool.uv.sources]
annemusic-shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]
